name: ImGUI Notepad (Windows)

on:
  push:
    branches: [ "imgui_application" ]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Optional: Commit SHA to checkout (defaults to current HEAD)'
        required: true

jobs:
  build_and_release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        ref: ${{ inputs.commit_sha || github.sha }}

    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: |
          build
        key: ${{ runner.os }}-cmake-${{ hashFiles('myAppImGUI/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-

    - name: Configure CMake
      run: cmake -S myAppImGUI -B build -G "Visual Studio 17 2022"

    - name: Build project
      run: cmake --build build --config Release

    - name: Get commit message
      id: commit_message
      run: |
        echo "message=$(git log -1 --pretty=format:%s)" >> $env:GITHUB_OUTPUT

    - name: List build output
      run: dir build\Release

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        name: "imgui_notepad_application"
        body: |
          • Commit: ${{ inputs.commit_sha || github.sha }}
          • Message: ${{ steps.commit_message.outputs.message }}
        files: build/Release/MyAppImGUI.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
