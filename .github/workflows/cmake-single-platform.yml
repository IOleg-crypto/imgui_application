name: ImGUI Notepad (Windows)

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Optional: Commit SHA to checkout (defaults to current HEAD)'
        required: false
      release_message:
        description: 'Message to include in the release'
        required: true

jobs:
  build_and_release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        ref: ${{ inputs.commit_sha || github.sha }}

    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: |
          build
        key: ${{ runner.os }}-cmake-${{ hashFiles('myAppImGUI/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-

    - name: Configure CMake
      run: cmake -S myAppImGUI -B build -G "Visual Studio 17 2022"

    - name: Build project
      run: cmake --build build --config Release

    - name: Create ZIP package with .exe and assets/
      run: |
        mkdir package
        copy build\Release\MyAppImGUI.exe package\
        xcopy /E /I /Y myAppImGUI\assets package\assets
        powershell -Command "Compress-Archive -Path package\* -DestinationPath build\Release\MyAppImGUI.zip"

    - name: List ZIP content
      run: powershell -Command "Expand-Archive -Path build\Release\MyAppImGUI.zip -DestinationPath test_extract; dir test_extract -Recurse"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        name: "imgui_notepad_application"
        body: |
          • Commit: ${{ inputs.commit_sha || github.sha }}
          • Message: ${{ inputs.release_message }}
        files: build/Release/MyAppImGUI.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
