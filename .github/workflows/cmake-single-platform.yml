name: ImGUI Notepad (Windows)

on:
  push:
    tags:
      - ImGUI Notepad
    branches: [ imgui_application ]

jobs:
  build_and_release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure CMake
      run: cmake -S myAppImGUI -B build -G "Visual Studio 17 2022"

    - name: Build project
      run: cmake --build build --config Release

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        asset_path: build\MyAppImGUI.exe
        name: ImGUI Notepad


